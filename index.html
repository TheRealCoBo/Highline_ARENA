<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Highline: Arena 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0c12;--elev:#12151e;--elev2:#1a1e2a;--border:#252b3a;--accent:#f5a623;--green:#3ecf8e;--red:#f16062;--yellow:#f5c842;--purple:#a78bfa;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--text:#e8eaf0;--dim:#8a8fa8;--r:10px;--fh:'Oswald',sans-serif;--fm:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fm);font-size:14px;min-height:100vh}
.topbar{background:var(--elev);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:58px;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-family:var(--fh);font-size:24px;font-weight:700;letter-spacing:.06em;background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-top:-2px}
.spacer{flex:1}
.season-badge{font-size:11px;color:var(--accent);background:rgba(245,166,35,.1);padding:4px 14px;border-radius:20px;border:1px solid rgba(245,166,35,.25);font-family:var(--fh);letter-spacing:.06em}
.btn-award{padding:7px 16px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--gold),var(--accent));color:#000;font-weight:700;font-family:var(--fh);font-size:13px;letter-spacing:.06em;cursor:pointer;transition:opacity .15s}
.btn-award:hover{opacity:.85}
.tab-nav{display:flex;background:var(--elev);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tab-btn{padding:12px 20px;border:none;background:none;color:var(--dim);font-family:var(--fh);font-size:14px;font-weight:500;letter-spacing:.06em;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-section{display:none}.tab-section.active{display:block}
main{padding:24px;max-width:1400px;margin:0 auto}
.card{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.card-header{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-header h3{font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;flex:1}
.card-body{padding:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.stat-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px;font-family:var(--fh)}
.stat-card .val{font-size:28px;font-family:var(--fh);font-weight:700}
.stat-card .sub{font-size:11px;color:var(--dim);margin-top:4px}
.stat-card.gold-card{border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.05)}.stat-card.gold-card .val{color:var(--gold)}
.stat-card.silver-card{border-color:rgba(192,192,192,.3)}.stat-card.silver-card .val{color:var(--silver)}
.stat-card.bronze-card{border-color:rgba(205,127,50,.3)}.stat-card.bronze-card .val{color:var(--bronze)}
.stat-card.green-card .val{color:var(--green)}
.stat-card.accent-card .val{color:var(--accent)}
.stat-card.purple-card .val{color:var(--purple)}
.btn{padding:7px 16px;border-radius:6px;border:1px solid var(--border);background:var(--elev2);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--fm);transition:background .15s}
.btn:hover{background:#252b3a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.btn.primary:hover{opacity:.85}
.btn.danger{background:rgba(241,96,98,.12);border-color:rgba(241,96,98,.4);color:var(--red)}
.btn.danger:hover{background:rgba(241,96,98,.22)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:2px 8px;font-size:11px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--fh);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--elev2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.rank-1{color:var(--gold);font-weight:700}.rank-2{color:var(--silver);font-weight:600}.rank-3{color:var(--bronze);font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.badge.gold{background:rgba(255,215,0,.15);color:var(--gold)}
.badge.silver{background:rgba(192,192,192,.15);color:var(--silver)}
.badge.green{background:rgba(62,207,142,.15);color:var(--green)}
.badge.red{background:rgba(241,96,98,.15);color:var(--red)}
.badge.accent{background:rgba(245,166,35,.15);color:var(--accent)}
.badge.purple{background:rgba(167,139,250,.15);color:var(--purple)}
.badge.dim{background:rgba(138,143,168,.1);color:var(--dim)}
.flex{display:flex;align-items:center;gap:8px}
input,select,textarea{background:var(--elev2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 11px;font-size:13px;font-family:var(--fm);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row.c2{grid-template-columns:1fr 1fr}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}
label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-family:var(--fh);display:block;margin-bottom:4px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h2{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:.06em;margin-bottom:18px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
#toast{position:fixed;bottom:24px;right:24px;background:var(--elev2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:340px}
.list-item{display:flex;align-items:center;gap:8px;background:var(--elev2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px}
.list-item .name{flex:1;font-size:13px}
.empty-state{text-align:center;padding:32px;color:var(--dim);font-size:13px}
.empty-state .icon{font-size:32px;margin-bottom:8px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:24px 0 8px}
.podium-slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px}
.podium-name{font-family:var(--fh);font-size:14px;font-weight:600;text-align:center;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-pts{font-size:11px;color:var(--dim)}
.podium-block{border-radius:6px 6px 0 0;width:110px;display:flex;align-items:center;justify-content:center;font-size:28px}
.podium-block.p1{height:110px;background:linear-gradient(180deg,rgba(255,215,0,.2),rgba(255,215,0,.05));border:1px solid rgba(255,215,0,.35);border-bottom:none}
.podium-block.p2{height:80px;background:linear-gradient(180deg,rgba(192,192,192,.15),rgba(192,192,192,.04));border:1px solid rgba(192,192,192,.3);border-bottom:none}
.podium-block.p3{height:60px;background:linear-gradient(180deg,rgba(205,127,50,.15),rgba(205,127,50,.04));border:1px solid rgba(205,127,50,.3);border-bottom:none}
.rep-sidebar{display:flex;flex-direction:column}
.rep-sidebar-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.rep-sidebar-item:hover{background:var(--elev2)}
.rep-sidebar-item.active{background:var(--elev2)}
.rep-sidebar-item:last-child{border-bottom:none}
.matrix-tbl{width:100%;border-collapse:collapse;font-size:12px}
.matrix-tbl th{font-family:var(--fh);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 10px;text-align:center;border-bottom:1px solid var(--border)}
.matrix-tbl td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:center}
.matrix-tbl tr:last-child td{border-bottom:none}
.matrix-tbl td:first-child{text-align:left;font-weight:600;color:var(--dim);font-size:11px}
.section-gap{margin-bottom:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr!important}.rep-layout{grid-template-columns:1fr!important}}
.sg-input,.sg-select{width:100%;border:none;color:var(--text);font-size:13px;font-family:var(--fm);padding:7px 10px;outline:none;height:37px;box-sizing:border-box}
.sg-input{background:transparent}
.sg-input:hover{background:rgba(255,255,255,.03);cursor:text}
.sg-select{background:var(--elev2);cursor:pointer;-webkit-appearance:auto;appearance:auto}
.sg-select:hover{background:var(--elev)}
.sg-select option{background:var(--elev2);color:var(--text)}
.sg-input:focus,.sg-select:focus{background:rgba(79,142,247,.1)!important;box-shadow:inset 0 0 0 2px var(--accent);position:relative;z-index:1}
.sg-row.sg-sel > td{background:rgba(245,166,35,.07)!important}
.sg-row.sg-sel > .sg-check{background:rgba(245,166,35,.13)!important}
.sg-check{width:36px;text-align:center;padding:4px 8px;border-bottom:1px solid var(--border)}
.sg-cell{border-bottom:1px solid var(--border);padding:0}
.sg-toolbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(245,166,35,.06);border-bottom:1px solid rgba(245,166,35,.2);font-size:12px}
.sg-row-edit > td{background:var(--elev2)!important}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--text)}
th.sortable.sort-on{color:var(--accent)}
.sort-arrow{font-size:10px;opacity:.5;margin-left:3px}
th.sort-on .sort-arrow{opacity:1;color:var(--accent)}
.tab-hidden{opacity:.4;border-bottom-style:dashed!important}
.tab-edit-controls{display:inline-flex;align-items:center;gap:2px;margin-left:6px;vertical-align:middle}
.tab-edit-icon{font-size:11px;cursor:pointer;padding:1px 4px;border-radius:3px;opacity:.65}
.tab-edit-icon:hover{opacity:1;background:rgba(255,255,255,.12)}
.em-card{border:1px dashed var(--accent)!important;position:relative}
.em-hidden{opacity:.35;border-style:dashed!important}
.em-card-btn{cursor:pointer;padding:2px 7px;border-radius:4px;font-size:11px;color:var(--dim);border:1px solid var(--border);background:var(--elev2);font-family:var(--fm);line-height:1.4}
.em-card-btn:hover{color:var(--text);background:var(--elev)}
.em-card-btn.em-on{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.em-bar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:rgba(245,166,35,.06);border-bottom:1px solid rgba(245,166,35,.25);flex-wrap:wrap}
.em-sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.em-grid-guide{background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 9px),rgba(245,166,35,.07) calc(25% - 9px),rgba(245,166,35,.07) calc(25% + 7px),transparent calc(25% + 7px),transparent 50%,transparent 50%,transparent calc(75% - 9px),rgba(245,166,35,.07) calc(75% - 9px),rgba(245,166,35,.07) calc(75% + 7px),transparent calc(75% + 7px),transparent 100%);padding:12px;border-radius:var(--r);border:1px dashed rgba(245,166,35,.2);margin:-4px}
.tour-overlay{position:fixed;inset:0;z-index:400;cursor:pointer;background-size:100% 100%}
.tour-card{position:fixed;z-index:402;background:var(--elev);border:1px solid var(--accent);border-radius:var(--r);padding:22px 26px;width:400px;max-width:calc(100vw - 32px);box-shadow:0 12px 48px rgba(0,0,0,.7);pointer-events:all}
.tour-dot{width:7px;height:7px;border-radius:50%;display:inline-block;transition:background .2s}
@keyframes tourGlow{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.7)}50%{box-shadow:0 0 0 10px rgba(245,166,35,0)}}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo" id="appLogo">⚡ HIGHLINE: ARENA 26</div>
    <div class="logo-sub">Competition Tracker</div>
  </div>
  <div class="spacer"></div>
  <div id="saveDot" style="font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap">✓ Saved</div>
  <div id="cloudDot" style="font-size:11px;color:var(--dim);opacity:0;transition:opacity .3s;white-space:nowrap"></div>
  <div class="season-badge" id="seasonBadge">Season</div>
  <button id="editModeBtn" class="btn" style="font-size:12px" onclick="toggleEditMode()">✏ Edit Layout</button>
  <button class="btn-award" onclick="openAwardModal()">+ Award Points</button>
</div>
<div id="mergeBanner" style="display:none;align-items:center;gap:12px;padding:8px 24px;background:rgba(167,139,250,.07);border-bottom:2px solid var(--purple);font-size:12px;color:var(--purple);font-family:var(--fh);letter-spacing:.05em">
  <span>⚡</span><span id="mergeInfo"></span>
  <button class="btn sm" style="font-size:11px;padding:4px 12px;border-color:var(--purple);color:var(--purple)" onclick="mergeAndApply()">Merge All</button>
  <button class="btn sm" style="font-size:11px;padding:4px 12px" onclick="dismissMerge()">Dismiss</button>
</div>
<div id="editModeBar" style="display:none;align-items:center;gap:12px;padding:8px 24px;background:rgba(245,166,35,.07);border-bottom:2px solid var(--accent);font-size:12px;color:var(--accent);font-family:var(--fh);letter-spacing:.05em">
  <span>✏ EDIT MODE — drag cards to reorder &nbsp;·&nbsp; ✎ rename &nbsp;·&nbsp; 👁 show/hide</span>
  <div style="flex:1"></div>
  <button class="btn sm" onclick="sendToCobo()" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);border-color:rgba(167,139,250,.5);color:#fff;font-weight:700">📩 Send to CoBo on Slack!</button>
</div>
<div class="tab-nav" id="tabNav"></div>
<main>
  <div id="tab-arena" class="tab-section active"></div>
  <div id="tab-reps" class="tab-section"></div>
  <div id="tab-scoreboard" class="tab-section"></div>
  <div id="tab-log" class="tab-section"></div>
  <div id="tab-points" class="tab-section"></div>
  <div id="tab-roster" class="tab-section"></div>
  <div id="tab-settings" class="tab-section"></div>
</main>

<!-- Award Points Modal -->
<div class="modal-bg" id="awardModal">
  <div class="modal">
    <h2>⚡ Award Points</h2>
    <div class="form-row c2">
      <div><label>Date</label><input type="date" id="awdDate"></div>
      <div><label>Points (editable)</label><input type="number" id="awdPoints" min="0"></div>
    </div>
    <div class="form-row">
      <div><label>Category</label><select id="awdCategory" onchange="onCatChange()"></select></div>
    </div>
    <div class="form-row">
      <div>
        <label>Quick-Select Team</label>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="awdTeamSelect" style="flex:1"><option value="">— Select a team to check all members —</option></select>
          <button class="btn sm" type="button" onclick="selectTeamReps()">Select All</button>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>Recipient(s)</label>
        <div id="awdRepList" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:200px;overflow-y:auto;padding:2px"></div>
      </div>
    </div>
    <div class="form-row">
      <div><label>Note (optional)</label><input type="text" id="awdNote" placeholder="Optional context"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('awardModal')">Cancel</button>
      <button class="btn primary" onclick="submitAward()">Award Points</button>
    </div>
  </div>
</div>

<!-- Rep Modal -->
<div class="modal-bg" id="repModal">
  <div class="modal">
    <h2 id="repModalTitle">Add Rep</h2>
    <div class="form-row c2">
      <div><label>Name</label><input type="text" id="repName" placeholder="Full name"></div>
      <div><label>Position</label>
        <select id="repPosition">
          <option value="Entry Level">Entry Level</option>
          <option value="Leader">Leader</option>
          <option value="Team Lead">Team Lead</option>
          <option value="Assistant Director">Assistant Director</option>
          <option value="Director">Director</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-row c2">
      <div><label>Team</label><select id="repTeam"><option value="">— No Team —</option></select></div>
      <div><label>Trainer</label><select id="repTrainer"><option value="">— None —</option></select></div>
    </div>
    <div class="form-row c2">
      <div><label>Status</label><select id="repStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
      <div></div>
    </div>
    <input type="hidden" id="repEditId">
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('repModal')">Cancel</button>
      <button class="btn primary" onclick="saveRep()">Save Rep</button>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-bg" id="catModal">
  <div class="modal">
    <h2 id="catModalTitle">Add Category</h2>
    <div class="form-row"><div><label>Name</label><input type="text" id="catName" placeholder="e.g. Sale: BF1 40k+"></div></div>
    <div class="form-row"><div><label>Description (optional)</label><input type="text" id="catDesc" placeholder="Short description"></div></div>
    <div class="form-row c2">
      <div><label>Points</label><input type="number" id="catPoints" min="0" placeholder="0"></div>
      <div><label>Type</label><select id="catType"><option value="individual">Individual</option><option value="team">Team</option></select></div>
    </div>
    <input type="hidden" id="catEditId">
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('catModal')">Cancel</button>
      <button class="btn primary" onclick="saveCat()">Save Category</button>
    </div>
  </div>
</div>

<!-- Team Modal -->
<div class="modal-bg" id="teamModal">
  <div class="modal" style="max-width:440px">
    <h2 id="teamModalTitle">Add Team</h2>
    <div class="form-row"><div><label>Team Name</label><input type="text" id="tmName" placeholder="e.g. Team Alpha"></div></div>
    <div class="form-row"><div><label>Team Leader</label><select id="tmLeader"><option value="">— None —</option></select></div></div>
    <input type="hidden" id="tmEditId">
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('teamModal')">Cancel</button>
      <button class="btn primary" onclick="saveTeam()">Save Team</button>
    </div>
  </div>
</div>

<!-- Weekly Award Modal -->
<div class="modal-bg" id="weeklyAwardModal">
  <div class="modal" style="max-width:480px">
    <h2>🏆 Weekly #1 Award</h2>
    <div id="weeklyAwardBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="skipWeeklyAward()">Skip This Week</button>
      <button class="btn primary" onclick="confirmWeeklyAward()">Award Points</button>
    </div>
  </div>
</div>

<!-- Promotion Confirmation Modal -->
<div class="modal-bg" id="promoModal">
  <div class="modal" style="max-width:480px">
    <h2>🏅 Official Promotion?</h2>
    <div id="promoBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="declinePromotion()">No — Just a Role Update</button>
      <button class="btn primary" onclick="confirmPromotion()">Yes — Award Points</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Seed Roster (from Highline Rep List CSV) ──────────────────────────────────
const SEED_REPS = [
  {id:'r001',name:'Maximilian Allen',position:'Director',team:'id_6irhmvdm116mpzov0pm',trainer:'r024',active:true},

// ── GitHub helpers ────────────────────────────────────────────────────────────
async function fetchGHFile(path, token=null){
  const headers = {'Accept':'application/vnd.github.v3+json'};
  if(token) headers['Authorization'] = `token ${token}`;
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {headers, cache:'no-store'});
    if(!res.ok) return null;
    const data = await res.json();
    const bytes = Uint8Array.from(atob(data.content.replace(/\n/g,'')), c=>c.charCodeAt(0));
    return {content: JSON.parse(new TextDecoder('utf-8').decode(bytes)), sha: data.sha};
  } catch(e){ return null; }
}

async function pushGHFile(path, content, sha, token, message){
  const encoded = new TextEncoder().encode(JSON.stringify(content));
  const binary = Array.from(encoded, b=>String.fromCharCode(b)).join('');
  const body = {message, content: btoa(binary)};
  if(sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method:'PUT',
    headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
    body: JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||`HTTP ${res.status}`); }
  return res.json();
}

}

function scheduleLivePush(){
  setCloudStatus('☁ saving…');
  clearTimeout(_livePushTimer);
  _livePushTimer = setTimeout(pushLiveState, 2500);
}

async function pushLiveState(){
  try {
    const state = Object.assign({}, S, {_bakedAt: Date.now()});
    // If SHA not yet fetched, grab it now before pushing
    if(!_liveStateSha){
      const existing = await fetchGHFile('live-state.json');
      if(existing) _liveStateSha = existing.sha;
    }
    const result = await pushGHFile('live-state.json', state, _liveStateSha, LIVE_WRITE_TOKEN, 'live: auto-save');
    _liveStateSha = result.content.sha;
    S._bakedAt = state._bakedAt;
    localStorage.setItem(SK, JSON.stringify(S));
    setCloudStatus('☁ Saved', 'var(--green)');
    setTimeout(()=>setCloudStatus(''), 3000);
  } catch(e){
    setCloudStatus(`⚠ ${e.message}`, 'var(--red)');
  }
}

async function startupSync(){
  if(IS_LIVE){
    // Live site: load from live-state.json (their persistent state), fall back to state.json
    const liveResult = await fetchGHFile('live-state.json');
    if(liveResult){
      _liveStateSha = liveResult.sha;
      const liveState = liveResult.content;
      if(!S._bakedAt || liveState._bakedAt > S._bakedAt) applyRemoteState(liveState);
    } else {
      const baseResult = await fetchGHFile('state.json');
      if(baseResult){
        const base = baseResult.content;
        if(!S._bakedAt || base._bakedAt > S._bakedAt) applyRemoteState(base);
      }
    }
  } else {
    // Local: check live-state.json for changes the live site made
    const liveResult = await fetchGHFile('live-state.json');
    if(!liveResult) return;
    _liveStateSha = liveResult.sha;
    const liveState = liveResult.content;
    if(liveState._bakedAt && (!S._bakedAt || liveState._bakedAt > S._bakedAt)){
      showMergeBanner(liveState);
    }
  }
}

function repPoints(repId, from, to){
  return S.events.filter(e => {
    if(!e.repIds.includes(repId)) return false;
    if(from && e.date < from) return false;
    if(to && e.date > to) return false;
    return true;
  }).reduce((s,e) => s + e.points, 0);
}

function leaderboard(from, to){
  return S.reps.filter(r => r.active)
    .map(r => ({...r, pts: repPoints(r.id, from, to)}))
    .sort((a,b) => b.pts - a.pts);
}

function weekBounds(){
  const d = new Date(), day = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}

function monthBounds(){
  const d = new Date();
  return [
    new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10),
    new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10)

}

function renderArena(){

  function cardBody(id, span){

        <div style="display:grid;grid-template-columns:${statCols};gap:12px">
          <div class="stat-card gold-card"><div class="lbl">Season Leader</div><div class="val">${leader&&leader.pts>0?leader.name.split(' ')[0]:'—'}</div><div class="sub">${leader&&leader.pts>0?leader.pts.toLocaleString()+' pts':'No data yet'}</div></div>

          <div class="stat-card green-card"><div class="lbl">Week Leader</div><div class="val">${weekly[0]&&weekly[0].pts>0?weekly[0].name.split(' ')[0]:'—'}</div><div class="sub">${weekly[0]&&weekly[0].pts>0?weekly[0].pts.toLocaleString()+' pts this week':'No events this week'}</div></div>
          <div class="stat-card purple-card"><div class="lbl">Month Leader</div><div class="val">${monthly[0]&&monthly[0].pts>0?monthly[0].name.split(' ')[0]:'—'}</div><div class="sub">${monthly[0]&&monthly[0].pts>0?monthly[0].pts.toLocaleString()+' pts this month':'No events this month'}</div></div>
          <div class="stat-card"><div class="lbl">Total Events</div><div class="val" style="color:var(--text)">${S.events.length}</div><div class="sub">${totalPts.toLocaleString()} pts awarded</div></div>
        </div></div>`;
    }

    if(id==='podium') return `<div class="card-body">
      <div class="podium">
        ${podiumOrder.map((r,i)=>{const f=r&&r.pts>0;return `<div class="podium-slot">
          <div class="podium-name" style="${!f?'color:var(--dim)':''}">${f?r.name:'—'}</div>
          <div class="podium-pts">${f?r.pts.toLocaleString()+' pts':'0 pts'}</div>
          <div class="podium-block ${podiumCls[i]}" style="${!f?'opacity:.3':''}">${podiumMedal[i]}</div>
        </div>`;}).join('')}
      </div></div>`;

    if(id==='weekmonth'){
      const cols = span>=3 ? '1fr 1fr' : '1fr';
      return `<div style="display:grid;grid-template-columns:${cols};gap:12px;padding:14px">
        <div>
          <div style="font-family:var(--fh);font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:8px">📅 This Week <span class="badge green" style="font-size:9px">${wS} – ${wE}</span></div>
          ${miniLB(weekly)}
        </div>
        <div>
          <div style="font-family:var(--fh);font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:8px">📆 This Month <span class="badge purple" style="font-size:9px">${mS.slice(0,7)}</span></div>
          ${miniLB(monthly)}

      <div class="tbl-wrap"><table>
        <thead><tr><th>Rank</th>

        </tr></thead>
        <tbody>
          ${_sortArr(overall.map(r=>({...r,evts:S.events.filter(e=>e.repIds.includes(r.id)).length})),'arena',{name:r=>r.name,team:r=>teamName(r.team)||'',pts:r=>r.pts,evts:r=>r.evts}).map((r,i)=>`<tr onclick="goToRep('${r.id}')" style="cursor:pointer">

function repDetail(rep){
  const [wS,wE] = weekBounds(), [mS,mE] = monthBounds(), today = todayStr();
  const seasonPts = repPoints(rep.id, S.config.startDate, S.config.endDate);
  const weekPts   = repPoints(rep.id, wS, wE);
  const monthPts  = repPoints(rep.id, mS, mE);
  const todayPts  = repPoints(rep.id, today, today);
  const evts = S.events.filter(e => e.repIds.includes(rep.id)).sort((a,b) => b.date.localeCompare(a.date));

  const breakdown = {};
  evts.forEach(e => {
    if(!breakdown[e.categoryId]) breakdown[e.categoryId] = {pts:0, count:0};
    breakdown[e.categoryId].pts += e.points;
    breakdown[e.categoryId].count++;
  });

  const overallLB = leaderboard(S.config.startDate, S.config.endDate);
  const rank = overallLB.findIndex(r => r.id === rep.id);

  return `
  <div class="stat-grid" style="grid-template-columns:repeat(5,1fr)">
    <div class="stat-card" style="border-color:rgba(255,215,0,.2)"><div class="lbl">Season Rank</div><div class="val ${rankClass(rank)}">${rankIcon(rank)}</div><div class="sub">${teamName(rep.team)||'—'}</div></div>
    <div class="stat-card gold-card"><div class="lbl">Season Total</div><div class="val">${seasonPts.toLocaleString()}</div><div class="sub">points</div></div>
    <div class="stat-card green-card"><div class="lbl">This Week</div><div class="val">${weekPts.toLocaleString()}</div><div class="sub">points</div></div>
    <div class="stat-card purple-card"><div class="lbl">This Month</div><div class="val">${monthPts.toLocaleString()}</div><div class="sub">points</div></div>
    <div class="stat-card accent-card"><div class="lbl">Today</div><div class="val">${todayPts.toLocaleString()}</div><div class="sub">points</div></div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Category Breakdown</h3></div>
    <div class="card-body" style="padding:0">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Category</th><th>Type</th><th class="num">Events</th><th class="num">Total Pts</th></tr></thead>
        <tbody>
          ${Object.entries(breakdown).sort((a,b)=>b[1].pts-a[1].pts).map(([cid,d]) => {
            const cat = S.categories.find(c => c.id === cid);
            return `<tr><td>${cat?cat.name:cid}</td><td>${cat?`<span class="badge ${cat.type==='team'?'accent':'purple'}">${cat.type}</span>`:'—'}</td><td class="num">${d.count}</td><td class="num"><strong>${d.pts.toLocaleString()}</strong></td></tr>`;
          }).join('')}
          ${!Object.keys(breakdown).length ? '<tr><td colspan="4" style="text-align:center;color:var(--dim);padding:16px">No events recorded</td></tr>' : ''}
        </tbody>
      </table></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Event History</h3><span class="badge dim">${evts.length} events</span></div>
    <div class="card-body" style="padding:0">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Pts</th><th></th></tr></thead>
        <tbody>
          ${evts.map(e => {
            const cat = S.categories.find(c => c.id === e.categoryId);
            return `<tr><td>${e.date}</td><td>${cat?cat.name:e.categoryId}</td><td style="color:var(--dim);max-width:200px;overflow:hidden;text-overflow:ellipsis">${e.note||''}</td><td class="num"><strong>${e.points.toLocaleString()}</strong></td><td><button class="btn xs danger" onclick="deleteEvent('${e.id}')">✕</button></td></tr>`;
          }).join('')}
          ${!evts.length ? '<tr><td colspan="5" style="text-align:center;color:var(--dim);padding:16px">No events yet</td></tr>' : ''}
        </tbody>
      </table></div>
    </div>
  </div>`;
}

// ── Sort Helpers ─────────────────────────────────────────────────────────────
const _sort = {};
function _sortArr(arr, id, acc){
  const s = _sort[id]; if(!s) return arr;
  return [...arr].sort((a,b)=>{
    let av = acc?.[s.f]?.(a) ?? a[s.f] ?? '';
    let bv = acc?.[s.f]?.(b) ?? b[s.f] ?? '';
    if(typeof av==='string') return s.d * av.localeCompare(bv);
    return s.d * (av - bv);
  });
}
function _sortBy(id, field){
  const cur = _sort[id];
  _sort[id] = { f: field, d: cur?.f===field ? -cur.d : 1 };
  renderTab(document.querySelector('.tab-btn.active').dataset.tab);
}
function _th(id, field, label, cls=''){
  const s=_sort[id], on=s?.f===field;
  const arrow = on ? (s.d===1?' ▲':' ▼') : ' <span class="sort-arrow">⇅</span>';
  return `<th class="sortable${on?' sort-on':''}" ${cls?`style="${cls}"`:''}onclick="_sortBy('${id}','${field}')">${label}${arrow}</th>`;
}

// ── Spreadsheet Grid Helpers ──────────────────────────────────────────────────
let _sgSel = {roster: new Set(), points: new Set()};
let _sgLastCk = {roster: null, points: null};

function _sgRowIds(grid){ return [...document.querySelectorAll(`#${grid}Body .sg-row`)].map(r=>r.dataset.id); }

function _sgSync(grid){
  const sel = _sgSel[grid];
  const bar = document.getElementById(`${grid}Toolbar`);
  const cnt = document.getElementById(`${grid}SelCount`);
  if(bar){ if(sel.size>0){bar.style.display='flex';if(cnt)cnt.textContent=sel.size+' selected';}else{bar.style.display='none';} }
  document.querySelectorAll(`#${grid}Body .sg-row`).forEach(row=>{
    const cb=row.querySelector('.row-cb'), on=sel.has(row.dataset.id);
    row.classList.toggle('sg-sel',on); if(cb)cb.checked=on;
  });
  const all=document.getElementById(`${grid}SelectAll`);
  if(all){const ids=_sgRowIds(grid);all.checked=ids.length>0&&ids.every(i=>sel.has(i));all.indeterminate=sel.size>0&&!all.checked;}
}

function sgCheckClick(e, grid, id){
  e.stopPropagation();
  const sel=_sgSel[grid];
  if(e.shiftKey&&_sgLastCk[grid]){
    const ids=_sgRowIds(grid),a=ids.indexOf(_sgLastCk[grid]),b=ids.indexOf(id);
    ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(i=>sel.add(i));
  } else { if(sel.has(id))sel.delete(id);else sel.add(id); }
  _sgLastCk[grid]=id; _sgSync(grid);
}

function sgSelectAll(grid, on){
  const sel=_sgSel[grid]; sel.clear();
  if(on) _sgRowIds(grid).forEach(id=>sel.add(id));
  _sgSync(grid);
}

function sgKey(e, el, grid){
  if(e.key==='Tab'){
    e.preventDefault();
    const row=el.closest('tr'), cells=[...row.querySelectorAll('.sg-input,.sg-select')], idx=cells.indexOf(el);
    if(e.shiftKey){ if(idx>0)cells[idx-1].focus(); else{const p=row.previousElementSibling;if(p){const pc=[...p.querySelectorAll('.sg-input,.sg-select')];if(pc.length)pc[pc.length-1].focus();}} }
    else { if(idx<cells.length-1)cells[idx+1].focus(); else{const n=row.nextElementSibling;if(n){const nc=[...n.querySelectorAll('.sg-input,.sg-select')];if(nc.length)nc[0].focus();}} }
  } else if(e.key==='Enter'){
    e.preventDefault();
    const row=el.closest('tr'),cells=[...row.querySelectorAll('.sg-input,.sg-select')],col=cells.indexOf(el);
    const next=row.nextElementSibling;
    if(next){const nc=[...next.querySelectorAll('.sg-input,.sg-select')];if(nc[col])nc[col].focus();}
  } else if(e.key==='Escape'){ el.blur(); }
}

function sgCopyGrid(grid){
  const sel=_sgSel[grid]; if(!sel.size){toast('Select rows first');return;}
  let lines=[];
  if(grid==='roster'){
    lines=['Name\tPosition\tTeam\tTrainer\tStatus'];
    [...sel].forEach(id=>{const r=S.reps.find(r=>r.id===id);if(r)lines.push([r.name,r.position||'',teamName(r.team)||'',S.reps.find(x=>x.id===r.trainer)?.name||'',r.active?'Active':'Inactive'].join('\t'));});
  } else {
    lines=['Name\tDescription\tType\tPoints'];
    [...sel].forEach(id=>{const c=S.categories.find(c=>c.id===id);if(c)lines.push([c.name,c.desc||'',c.type,c.points].join('\t'));});
  }
  navigator.clipboard?.writeText(lines.join('\n'));
  toast(`Copied ${sel.size} row${sel.size>1?'s':''} to clipboard`);
}

function sgDeleteSelected(grid){
  const sel=_sgSel[grid]; if(!sel.size)return;
  const n=sel.size;
  if(!confirm(`Delete ${n} selected row${n>1?'s':''}?`))return;
  if(grid==='roster'){ S.reps=S.reps.filter(r=>!sel.has(r.id)); save(); _sgSel.roster.clear(); renderRoster(); }
  else { S.categories=S.categories.filter(c=>!sel.has(c.id)||c.system); save(); _sgSel.points.clear(); renderPoints(); }
  toast(`Deleted ${n} row${n>1?'s':''}`);
}

async function deployToGitHub(){
  const token = localStorage.getItem('gh_deploy_token') || (document.getElementById('ghTokenInput').value||'').trim();
  if(!token){ toast('Enter a GitHub PAT first','red'); return; }
  if(_pendingLiveState){ toast('You have unmerged live changes — merge or dismiss before pushing','yellow'); return; }

  const statusEl = document.getElementById('deployStatus');
  const btn = document.getElementById('deployBtn');
  const setStatus = (msg, color='var(--dim)') => { if(statusEl){ statusEl.textContent = msg; statusEl.style.color = color; } };

  btn.disabled = true;
  setStatus('Pushing to GitHub…');

  try {
    const ts = new Date().toISOString().slice(0,16).replace('T',' ');
    const stateWithTs = Object.assign({}, S, {_bakedAt: Date.now()});

    // Push state.json
    const stateFile = await fetchGHFile('state.json', token);
    await pushGHFile('state.json', stateWithTs, stateFile?.sha||null, token, `State: ${ts}`);

    // Push live-state.json so the live site picks up the admin's push
    const liveFile = await fetchGHFile('live-state.json', token);
    const liveResult = await pushGHFile('live-state.json', stateWithTs, liveFile?.sha||_liveStateSha||null, token, `Live: ${ts}`);
    _liveStateSha = liveResult.content.sha;

    S._bakedAt = stateWithTs._bakedAt;
    localStorage.setItem(SK, JSON.stringify(S));

    setStatus('✓ Live for all users in ~30s.', 'var(--green)');
    toast('Pushed to GitHub ⚡','green');
  } catch(e){
    setStatus('✗ ' + e.message, 'var(--red)');
    toast('Push failed — ' + e.message,'red');
  } finally {
    btn.disabled = false;
  }
}

async function publishHtmlToGitHub(file){
  if(!file) return;
  const token = localStorage.getItem('gh_deploy_token') || (document.getElementById('ghTokenInput').value||'').trim();
  if(!token){ toast('Enter a GitHub PAT first','red'); return; }

  const repo = 'TheRealCoBo/Highline_ARENA';
  const path = 'index.html';
  const statusEl = document.getElementById('deployStatus');
  const setStatus = (msg, color='var(--dim)') => { if(statusEl){ statusEl.textContent = msg; statusEl.style.color = color; } };

  setStatus('Reading file…');
  try {
    let htmlContent = await file.text();

    // Encode the live token (XOR+base64) so GitHub secret scanning doesn't block the push
    const liveToken = localStorage.getItem('live_write_token') || '';
    const encodedToken = liveToken
      ? btoa(liveToken.split('').map((c,i)=>String.fromCharCode(c.charCodeAt(0)^'ARENA26HIGHLINE'.charCodeAt(i%14))).join(''))
      : '';
    htmlContent = htmlContent.replace(
      /const LIVE_WRITE_TOKEN = .*?; \/\*LIVE_TOKEN_MARKER\*\//,
      `const LIVE_WRITE_TOKEN = (s=>s?atob(s).split('').map((c,i)=>String.fromCharCode(c.charCodeAt(0)^'ARENA26HIGHLINE'.charCodeAt(i%14))).join(''):'')('${encodedToken}'); /*LIVE_TOKEN_MARKER*/`
    );

    // Fetch SHA only (file content is HTML, not JSON — can't use fetchGHFile)
    let htmlSha = null;
    try {
      const shaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`, {
        headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'},
        cache:'no-store'
      });
      if(shaRes.ok) htmlSha = (await shaRes.json()).sha || null;
    } catch(e){}

    setStatus('Pushing app HTML to GitHub…');
    const encoded = new TextEncoder().encode(htmlContent);
    const binary = Array.from(encoded, b=>String.fromCharCode(b)).join('');
    const ts = new Date().toISOString().slice(0,16).replace('T',' ');
    const body = { message:`App: ${ts}`, content: btoa(binary) };
    if(htmlSha) body.sha = htmlSha;

    const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/index.html`, {
      method:'PUT',
      headers:{ 'Authorization':`token ${token}`, 'Content-Type':'application/json', 'Accept':'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    if(!putRes.ok){ const e=await putRes.json(); throw new Error(e.message||`HTTP ${putRes.status}`); }

    setStatus('✓ App published! GitHub Pages updates in ~3min.', 'var(--green)');
    toast('App HTML published to GitHub ✓','green');
  } catch(e){
    setStatus('✗ ' + e.message, 'var(--red)');
    toast('Publish failed — ' + e.message,'red');
  }
}

  const points     = parseInt(document.getElementById('awdPoints').value) || 0;
  const note       = document.getElementById('awdNote').value.trim();
  const repIds     = [...document.querySelectorAll('#awdRepList input:checked')].map(i => i.value);
  if(!date)         { toast('Select a date','red'); return; }
  if(!categoryId)   { toast('Select a category','red'); return; }
  if(!repIds.length){ toast('Select at least one rep','red'); return; }
  if(points <= 0)   { toast('Points must be > 0','red'); return; }
  S.events.push({id:uid(), date, categoryId, points, repIds, note});
  save(); closeModal('awardModal');
  renderTab(document.querySelector('.tab-btn.active').dataset.tab);
  toast(`+${points.toLocaleString()} pts awarded to ${repIds.length} rep${repIds.length>1?'s':''} ⚡`);
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _tt;
function toast(msg, type=''){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type==='red' ? 'var(--red)' : 'var(--border)';
  el.style.opacity = '1';
  clearTimeout(_tt);
  _tt = setTimeout(() => el.style.opacity='0', 2800);
}

// ── Edit Mode ─────────────────────────────────────────────────────────────────

function toggleTabVisible(id){

}

function renameCard(id){

// ── Arena Card Drag-and-Drop ──────────────────────────────────────────────────
function cardDragStart(e, id){
  _dragCardId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  // Fade after browser captures the drag ghost
  requestAnimationFrame(()=>{
    const el = document.querySelector(`[data-card-id="${id}"]`);
    if(el) el.style.opacity = '.35';
  });
}

function cardDragOver(e, id){
  e.preventDefault(); // must call to allow drop
  e.dataTransfer.dropEffect = 'move';
  if(!_dragCardId || _dragCardId === id) return;
  document.querySelectorAll('[data-card-id]').forEach(el => el.classList.remove('drag-target'));
  const target = document.querySelector(`[data-card-id="${id}"]`);
  if(target) target.classList.add('drag-target');
}

function cardDrop(e, targetId){
  e.preventDefault();
  const fromId = _dragCardId || e.dataTransfer.getData('text/plain');
  if(!fromId || fromId === targetId) { cardDragEnd(); return; }
  const cards = S.layout.arenaCards;
  const fromIdx = cards.findIndex(c=>c.id===fromId);
  const toIdx   = cards.findIndex(c=>c.id===targetId);
  if(fromIdx < 0 || toIdx < 0) { cardDragEnd(); return; }
  const [moved] = cards.splice(fromIdx, 1);
  cards.splice(toIdx, 0, moved);
  _dragCardId = null;
  save();
  renderArena();
}

function cardDragEnd(){
  _dragCardId = null;
  document.querySelectorAll('[data-card-id]').forEach(el => {
    el.style.opacity = '';
    el.classList.remove('drag-target');
  });
}

// ── Export / Import / Send to CoBo ───────────────────────────────────────────
function _dl(content, filename, type='application/json'){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportData(){
  _dl(JSON.stringify(S, null, 2), `Arena26-backup-${todayStr()}.json`);
  toast('Data exported — keep this file safe');
}

function importData(file){
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if(!d.config || !d.reps) { toast('Invalid backup file','red'); return; }
      Object.assign(S, d);
      ensureSystemCats(); ensureLayout(); save();
      renderTabNav(); renderTab(_activeTab);
      toast('Data imported successfully');
    } catch(ex) { toast('Could not parse file','red'); }
  };
  r.readAsText(file);
}

function sendToCobo(){
  const payload = {
    _note: 'Highline Arena 26 — layout & config snapshot. Send to CoBo on Slack to bake in changes.',
    _date: todayStr(),
    config: S.config,
    layout: S.layout,
  };
  _dl(JSON.stringify(payload, null, 2), 'Send to CoBo on Slack!.json');
  toast('📩 File ready — send it to CoBo on Slack!');
}

// ── Weekly #1 Award ───────────────────────────────────────────────────────────
function weekMonday(dateStr){
  const d = new Date(dateStr + 'T12:00:00'), day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().slice(0,10);
}
function weekSunday(mondayStr){
  const d = new Date(mondayStr + 'T12:00:00');
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0,10);
}
function fmtWeekRange(mon){
  const sun = weekSunday(mon);
  return `${mon} – ${sun}`;
}

let pendingWeeklyAward = null;

function checkWeeklyAward(){
  if(!S.processedWeeks) S.processedWeeks = [];
  const today = todayStr();
  if(today < S.config.startDate || today > S.config.endDate) return;

  const thisMonday = weekMonday(today);
  const prevMon = new Date(thisMonday + 'T12:00:00');
  prevMon.setDate(prevMon.getDate() - 7);
  const prevMonStr = prevMon.toISOString().slice(0,10);

  if(prevMonStr < S.config.startDate) return;
  if(S.processedWeeks.find(w => w.monday === prevMonStr)) return;

  const prevSunStr = weekSunday(prevMonStr);
  const lb = leaderboard(prevMonStr, prevSunStr).filter(r => r.pts > 0);

  if(!lb.length){
    S.processedWeeks.push({monday:prevMonStr, winnerId:null, winnerPts:0, awarded:false, skipped:true});
    save(); return;
  }

  const cat = S.categories.find(c => c.id === 'cat_weekly_win');
  pendingWeeklyAward = {monday:prevMonStr, sunday:prevSunStr, winner:lb[0], awardPts:cat?.points||200};
  setTimeout(openWeeklyAwardModal, 500);
}

function openWeeklyAwardModal(){
  if(!pendingWeeklyAward) return;
  const {monday, sunday, winner, awardPts} = pendingWeeklyAward;
  document.getElementById('weeklyAwardBody').innerHTML = `
    <div style="padding:16px;background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(245,166,35,.04));border:1px solid rgba(255,215,0,.25);border-radius:8px;margin-bottom:18px">
      <div style="font-size:10px;font-family:var(--fh);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:10px">Week of ${monday} – ${sunday}</div>
      <div style="font-family:var(--fh);font-size:24px;font-weight:700;margin-bottom:4px">🥇 ${esc(winner.name)}</div>
      <div style="font-size:13px;color:var(--dim)">${winner.pts.toLocaleString()} pts earned this week</div>
    </div>
    <div class="form-row">
      <div>
        <label>Points to Award</label>
        <input type="number" id="wkAwardPts" value="${awardPts}" min="0" style="max-width:160px">
        <div style="font-size:11px;color:var(--dim);margin-top:4px">Adjust before confirming if needed</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--dim);margin-top:10px">Award points to <strong style="color:var(--text)">${esc(winner.name)}</strong> and mark this week as complete. Selecting <strong>Skip</strong> marks the week done without awarding.</p>`;
  document.getElementById('weeklyAwardModal').classList.add('open');
}

function confirmWeeklyAward(){
  if(!pendingWeeklyAward) return;
  const pts = parseInt(document.getElementById('wkAwardPts').value) || 0;
  const {monday, sunday, winner} = pendingWeeklyAward;
  S.events.push({id:uid(), date:sunday, categoryId:'cat_weekly_win', points:pts, repIds:[winner.id], note:`Weekly #1 — week of ${monday}`});
  S.processedWeeks.push({monday, winnerId:winner.id, winnerPts:winner.pts, awarded:true, awardedPts:pts});
  save(); pendingWeeklyAward = null;
  closeModal('weeklyAwardModal');
  renderTab(document.querySelector('.tab-btn.active').dataset.tab);
  toast(`🏆 +${pts.toLocaleString()} pts awarded to ${winner.name}`);
}

function skipWeeklyAward(){
  if(!pendingWeeklyAward) return;
  const {monday, winner} = pendingWeeklyAward;
  S.processedWeeks.push({monday, winnerId:winner.id, winnerPts:winner.pts, awarded:false});
  save(); pendingWeeklyAward = null;
  closeModal('weeklyAwardModal');
  toast('Weekly award skipped for this week');
}

let _tourStep = 0;

function startTour(){
  _tourStep = 0;
  _renderTourStep();
}

function _renderTourStep(){
  // Clean up previous step
  document.querySelector('.tour-overlay')?.remove();
  document.querySelector('.tour-card')?.remove();

  const step = TOUR_STEPS[_tourStep];
  const total = TOUR_STEPS.length;
  const target = step.target ? document.querySelector(step.target) : null;

  // Build overlay with SVG spotlight cutout
  const overlay = document.createElement('div');
  overlay.className = 'tour-overlay';

  if(target){
    const r = target.getBoundingClientRect();
    const pad = 8, vw = window.innerWidth, vh = window.innerHeight;
    const x = Math.max(0, r.left - pad), y = Math.max(0, r.top - pad);
    const w = r.width + pad*2, h = r.height + pad*2;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${vw}' height='${vh}'>
      <defs><mask id='hole'>
        <rect width='${vw}' height='${vh}' fill='white'/>
        <rect x='${x}' y='${y}' width='${w}' height='${h}' rx='7' fill='black'/>
      </mask></defs>
      <rect width='${vw}' height='${vh}' fill='rgba(0,0,0,0.75)' mask='url(%23hole)'/>
      <rect x='${x}' y='${y}' width='${w}' height='${h}' rx='7' fill='none' stroke='rgba(245,166,35,0.8)' stroke-width='2'/>
    </svg>`;
    overlay.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    overlay.style.backgroundSize = '100% 100%';
  } else {
    overlay.style.background = 'rgba(0,0,0,0.75)';
  }

  overlay.addEventListener('click', () => {
    if(_tourStep < total-1) tourNext(); else endTour();
  });

  // Build tour card
  const card = document.createElement('div');
  card.className = 'tour-card';
  card.addEventListener('click', e => e.stopPropagation());

  // Position card near target
  let cardTop = null, cardLeft = null, cardBottom = null, cardTransform = '';
  if(target){
    const r = target.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const cw = Math.min(400, vw - 32), ch = 220;
    if(r.bottom + ch + 20 < vh){
      cardTop = r.bottom + 16; cardLeft = Math.min(Math.max(r.left, 16), vw - cw - 16);
    } else {
      cardBottom = vh - r.top + 16; cardLeft = Math.min(Math.max(r.left, 16), vw - cw - 16);
    }
  } else {
    cardTop = 0; cardLeft = 0; cardTransform = 'translate(calc(50vw - 50%), calc(50vh - 50%))';
  }

  card.style.cssText = [
    cardTop    !== null ? `top:${cardTop}px`       : '',
    cardBottom !== null ? `bottom:${cardBottom}px` : '',
    cardLeft   !== null ? `left:${cardLeft}px`     : '',
    cardTransform       ? `transform:${cardTransform}` : '',
  ].filter(Boolean).join(';');

  const dots = TOUR_STEPS.map((_,i) =>
    `<span class="tour-dot" style="background:${i===_tourStep?'var(--accent)':'var(--border)'}"></span>`
  ).join('');

  card.innerHTML = `
    <div style="font-size:10px;color:var(--accent);font-family:var(--fh);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">
      Step ${_tourStep+1} of ${total}
    </div>
    <div style="font-family:var(--fh);font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.2">${step.title}</div>
    <p style="font-size:13px;line-height:1.65;color:var(--dim);margin-bottom:18px">${step.body}</p>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn sm" onclick="endTour()" style="color:var(--dim);font-size:11px">Skip</button>
      <div style="flex:1;display:flex;gap:4px;justify-content:center">${dots}</div>
      <div style="display:flex;gap:6px">
        ${_tourStep > 0 ? `<button class="btn sm" onclick="tourPrev()">← Back</button>` : ''}
        ${_tourStep < total-1
          ? `<button class="btn primary sm" onclick="tourNext()">Next →</button>`
          : `<button class="btn primary sm" onclick="endTour()">🏁 Let's Go!</button>`}
      </div>
    </div>`;

  document.body.appendChild(overlay);
  document.body.appendChild(card);
}

function tourNext(){ _tourStep = Math.min(_tourStep+1, TOUR_STEPS.length-1); _renderTourStep(); }
function tourPrev(){ _tourStep = Math.max(_tourStep-1, 0); _renderTourStep(); }

function endTour(){
  document.querySelector('.tour-overlay')?.remove();
  document.querySelector('.tour-card')?.remove();
  localStorage.setItem('arena26_toured','1');
}
